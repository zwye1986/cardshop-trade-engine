spring:
  liquibase:
    enabled: true
  rabbitmq:
    virtual-host: cardshop-trade-dev
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

trade:
  engine:
    environment: dev
    redis:
      write-enabled: true
    balance:
      owner-mode: NEW
    mq:
      publish-confirm-timeout-ms: 1000
    fault-injection:
      enabled: false
    integration:
      manual-job-enabled: false
    xxl-job:
      enabled: false
