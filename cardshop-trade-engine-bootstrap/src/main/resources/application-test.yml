spring:
  liquibase:
    enabled: true
  rabbitmq:
    virtual-host: cardshop-trade-test
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

trade:
  engine:
    environment: test
    redis:
      write-enabled: true
    fault-injection:
      enabled: true
    integration:
      manual-job-enabled: false
    xxl-job:
      enabled: false
    mq:
      publish-confirm-timeout-ms: 500
