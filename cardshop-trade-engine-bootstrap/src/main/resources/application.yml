server:
  port: ${SERVER_PORT:10080}

# 日志目录桥接：start.sh / dev-local.sh 会 export LOG_DIR（默认 $APP_HOME/logs）。
# Spring 据此设置系统属性 LOG_PATH，供 logback-spring.xml 的 ${LOG_PATH} 引用；
# LOG_DIR 未设置时回落到 ./logs，适配本地未走部署脚本的场景。
# 详见 cardshop-trade-engine-bootstrap/src/main/resources/logback-spring.xml。
logging:
  file:
    path: ${LOG_DIR:./logs}

spring:
  main:
    web-application-type: reactive
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:}
    password: ${SPRING_RABBITMQ_PASSWORD:}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:cardshop-trade-dev}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 50
        concurrency: 4
        max-concurrency: 16
    template:
      mandatory: true
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,tradeEngineReadiness
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

trade:
  engine:
    redis:
      write-enabled: false
      wait-replicas: 1
      wait-timeout-ms: 100
      pending-org-bucket-count: 128
      unavailable-fail-closed: true
      lua-warn-threshold-ms: 30
    mq:
      persist-exchange: recharge.persist.exchange
      persist-routing-key: recharge.persist.mysql
      persist-queue: recharge.persist.mysql.queue
      persist-dead-letter-exchange: recharge.persist.dlx
      persist-dead-letter-queue: recharge.persist.mysql.dlq
      persist-dead-letter-routing-key: recharge.persist.mysql.dlq
      consumer-max-retry: 3
      persist-retry-exchange: recharge.persist.retry.exchange
      persist-retry-queue: recharge.persist.mysql.retry.queue
      persist-retry-routing-key: recharge.persist.mysql.retry
      consumer-retry-delay-ms: 30000
      publish-confirm-timeout-ms: 500
      publish-retry-times: 3
      confirm-worker-queue-capacity: 10000
      breaker:
        enabled: true
        failure-threshold: 20
        rolling-window-seconds: 30
        open-seconds: 30
        half-open-permits: 3
    order:
      pending-ttl-days: 7
      terminal-ttl-hours: 72
      pending-protect-seconds: 300
      request-hash-version: v1
      request-hash-alg: SHA-256
      config-changed-retry-min-ms: 500
      config-changed-retry-max-ms: 2000
    integration:
      manual-job-timeout-ms: 30000
    xxl-job:
      enabled: false
      admin-addresses: ${XXL_JOB_ADMIN_ADDRESSES:}
      access-token: ${XXL_JOB_ACCESS_TOKEN:}
      executor:
        appname: ${XXL_JOB_EXECUTOR_APPNAME:cardshop-trade-engine}
        address: ${XXL_JOB_EXECUTOR_ADDRESS:}
        ip: ${XXL_JOB_EXECUTOR_IP:}
        port: ${XXL_JOB_EXECUTOR_PORT:19999}
        logpath: ${XXL_JOB_EXECUTOR_LOGPATH:/data/logs/cardshop-trade-engine/xxl-job}
        log-retention-days: ${XXL_JOB_EXECUTOR_LOG_RETENTION_DAYS:30}
    routing:
      enabled: true
      legacy-base-url: ${LEGACY_CARD_SHOP_BASE_URL:}
      proxy-timeout-ms: 3000
      gray-org-codes: []
      gray-app-ids: []
      supported-paths:
        - /v1/cardapi/auth/getToken
        - /v1/cardapi/order/createRechargeOrder
        - /v1/cardapi/order/getRechargeOrder
        - /v1/cardapi/order/invalid
    v1:
      request-sm4-enabled: true
      timestamp-allowed-skew-seconds: 300
      nonce-replay-ttl-seconds: 600
      token-clock-skew-seconds: 30
      token-ttl-seconds: 10800
      sign-alg: SM3
      jwt-secret: ${V1_CARDAPI_JWT_SECRET:}
      token-redis-key-prefix: "token:app_id:"
      token-claim-key: "order_token_key:"
      product-cache:
        refresh-after: ${TRADE_ENGINE_V1_PRODUCT_CACHE_REFRESH_AFTER:25m}
        max-stale-age: ${TRADE_ENGINE_V1_PRODUCT_CACHE_MAX_STALE_AGE:30m}
        physical-ttl: ${TRADE_ENGINE_V1_PRODUCT_CACHE_PHYSICAL_TTL:60m}
        refresh-lock-ttl: ${TRADE_ENGINE_V1_PRODUCT_CACHE_REFRESH_LOCK_TTL:5s}
        refresh-wait-timeout: ${TRADE_ENGINE_V1_PRODUCT_CACHE_REFRESH_WAIT_TIMEOUT:1s}
        negative-cache-ttl: ${TRADE_ENGINE_V1_PRODUCT_CACHE_NEGATIVE_CACHE_TTL:1m}
      crypto:
        sm4-key-source: MERCHANT_SECRET
        sign-key-source: MERCHANT_SECRET
        key-rotation-previous-enabled: true
    balance:
      owner-mode: NEW
      reconcile-diff-threshold-cent: 100
    thread-pool:
      db-core-size: 16
      db-max-size: 32
      mq-confirm-worker-size: 8
      supplier-io-size: 32
      queue-capacity: 10000
    health:
      external-check-enabled: false
