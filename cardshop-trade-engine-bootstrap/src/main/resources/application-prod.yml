spring:
  liquibase:
    enabled: false
  rabbitmq:
    virtual-host: cardshop-trade-prod
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

trade:
  engine:
    environment: prod
    redis:
      write-enabled: false
    fault-injection:
      enabled: false
    mq:
      publish-confirm-timeout-ms: 500
