# 名创专属协议默认关闭；仅供受控dev/test配置，不包含供应商凭证。
# 先执行0020/0021迁移并确认冻结批次、凭据与核销事件持久化，再在dev/test窗口显式启用。
trade:
  engine:
    supplier:
      http-enabled: false
      miniso:
        enabled: false
        base-url: ${MINISO_BASE_URL:}
        tenant: MINISO
        tripartite: ${MINISO_TRIPARTITE:}
        version: tripartite1.0
        key: ${MINISO_API_KEY:}
        timeout-ms: 3000
        # 核销接收/恢复与主动发券独立；停入口后可保留processing-enabled继续恢复。
        callback:
          enabled: false
          processing-enabled: false
          key2: ${MINISO_CALLBACK_KEY2:}
          batch-size: 100
          retry-backoff-seconds: 60
          max-retry-count: 100
          max-body-bytes: 4096
          receive-threads: 4
          receive-queue-capacity: 256
          transaction-timeout-seconds: 5
