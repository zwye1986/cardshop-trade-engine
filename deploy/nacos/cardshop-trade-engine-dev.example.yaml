spring:
  datasource:
    url: jdbc:mysql://<mysql-host>/cardshop_test?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&allowMultiQueries=true
    username: <mysql-user>
    password: <mysql-password>
    hikari:
      maximum-pool-size: 16
      minimum-idle: 4
      connection-timeout: 2000
  data:
    redis:
      # Keep dev Redis values consistent with legacy cardshop dev. Spring Boot 3 must use spring.data.redis.*.
      host: <cardshop-dev-redis-host>
      port: 6379
      database: 15
      password: <cardshop-dev-redis-password>
      timeout: 3s
      lettuce:
        pool:
          min-idle: 20
          max-idle: 50
          max-active: 100
          max-wait: 5000ms
  liquibase:
    enabled: true
  rabbitmq:
    virtual-host: cardshop-trade-dev
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

trade:
  engine:
    environment: dev
    redis:
      write-enabled: true
    balance:
      owner-mode: NEW
    mq:
      publish-confirm-timeout-ms: 1000
    fault-injection:
      enabled: false
    integration:
      manual-job-enabled: false
