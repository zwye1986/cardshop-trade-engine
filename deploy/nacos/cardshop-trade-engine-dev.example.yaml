spring:
  datasource:
    # rewriteBatchedStatements=true 是批消费阶段 1 必做项；开启 trade.engine.mq.persist-batch-enabled 时启动会校验。
    url: jdbc:mysql://<mysql-host>/cardshop_test?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&allowMultiQueries=true&rewriteBatchedStatements=true
    username: <mysql-user>
    password: <mysql-password>
    hikari:
      maximum-pool-size: 16
      minimum-idle: 4
      connection-timeout: 2000
  data:
    redis:
      # Keep dev Redis values consistent with legacy cardshop dev. Spring Boot 3 must use spring.data.redis.*.
      host: <cardshop-dev-redis-host>
      port: 6379
      database: 15
      password: <cardshop-dev-redis-password>
      timeout: 3s
      lettuce:
        pool:
          min-idle: 20
          max-idle: 50
          max-active: 100
          max-wait: 5000ms
  liquibase:
    enabled: true
  rabbitmq:
    virtual-host: cardshop-trade-dev
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

trade:
  engine:
    environment: dev
    redis:
      write-enabled: true
    balance:
      owner-mode: NEW
    mq:
      publish-confirm-timeout-ms: 1000
    fault-injection:
      enabled: false
    v1:
      merchant-config-preheat:
        enabled: false
        org-codes: []
        fail-on-error: true
    integration:
      manual-job-enabled: false
      manual-job-timeout-ms: 30000
    xxl-job:
      enabled: false
      admin-addresses: ${XXL_JOB_ADMIN_ADDRESSES:}
      access-token: ${XXL_JOB_ACCESS_TOKEN:}
      executor:
        appname: cardshop-trade-engine-dev
        address:
        ip:
        port: 19999
        logpath: /data/logs/cardshop-trade-engine/xxl-job
        log-retention-days: 30
