  # 0014：创建供应商履约可靠事件表。对应 docs/交行直充业务系统详细设计.md「8.2 Liquibase 约束」「9.1 派单 Outbox」。
  - changeSet:
      id: 0014-d2-create-recharge-dispatch-outbox
      author: codex
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              create table if not exists recharge_dispatch_outbox (
                id bigint not null auto_increment comment '表主键',
                event_id varchar(100) not null comment '履约事件唯一ID',
                event_type varchar(64) not null comment '履约事件类型',
                org_code varchar(64) not null comment '商户编码',
                order_id varchar(100) not null comment '平台订单号',
                out_order_sn varchar(100) not null comment '商户订单号',
                payload json not null comment '履约事件参数JSON',
                status varchar(32) not null comment '事件状态',
                retry_count int not null default 0 comment '已重试次数',
                max_retry_count int not null default 10 comment '最大重试次数',
                next_retry_time datetime not null comment '下次允许执行时间',
                locked_by varchar(100) default null comment '当前抢占该事件的应用实例ID',
                locked_until datetime default null comment '抢占租约到期时间',
                version bigint not null default 0 comment '乐观锁版本号',
                last_error varchar(1000) default null comment '最近一次失败原因',
                shard_key varchar(128) not null comment '固定使用event_id，避免不同任务分片语义冲突',
                created_at datetime not null default current_timestamp comment '创建时间',
                updated_at datetime not null default current_timestamp on update current_timestamp comment '更新时间',
                primary key (id),
                unique key uk_dispatch_outbox_event_id (event_id),
                key idx_dispatch_outbox_due (status, next_retry_time, id),
                key idx_dispatch_outbox_lease (status, locked_until, id)
              ) engine=InnoDB default charset=utf8mb4 comment='交易订单供应商履约可靠事件表'
      rollback:
        - sql:
            sql: |
              drop table if exists recharge_dispatch_outbox
  # 0015：创建余额增量刷账事件表。对应 docs/交行直充业务系统详细设计.md「8.2 Liquibase 约束」「9.2 余额 Delta 刷账 Outbox」。
  - changeSet:
      id: 0015-d2-create-recharge-balance-delta-outbox
      author: codex
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              create table if not exists recharge_balance_delta_outbox (
                id bigint not null auto_increment comment '表主键',
                event_id varchar(120) not null comment '余额刷账事件唯一ID',
                org_code varchar(64) not null comment '商户编码',
                order_id varchar(100) not null comment '平台订单号',
                out_order_sn varchar(100) not null comment '商户订单号',
                delta_type varchar(32) not null comment '余额变动类型，例如 PRE_DEDUCT 或 RELEASE',
                delta_amount bigint not null comment '余额变动金额，单位分；扣减为负，释放为正',
                status varchar(32) not null comment '刷账状态',
                retry_count int not null default 0 comment '已重试次数',
                max_retry_count int not null default 10 comment '最大重试次数',
                next_retry_time datetime not null comment '下次允许执行时间',
                locked_by varchar(100) default null comment '当前抢占该事件的应用实例ID',
                locked_until datetime default null comment '抢占租约到期时间',
                version bigint not null default 0 comment '乐观锁版本号',
                last_error varchar(1000) default null comment '最近一次失败原因',
                created_at datetime not null default current_timestamp comment '创建时间',
                updated_at datetime not null default current_timestamp on update current_timestamp comment '更新时间',
                primary key (id),
                unique key uk_balance_delta_event_id (event_id),
                key idx_balance_delta_due (status, next_retry_time, org_code, id),
                key idx_balance_delta_lease (status, locked_until, id),
                key idx_balance_delta_org_status (org_code, status, id)
              ) engine=InnoDB default charset=utf8mb4 comment='交易订单余额增量刷账事件表'
      rollback:
        - sql:
            sql: |
              drop table if exists recharge_balance_delta_outbox
  # 0016：删除低基数二级索引 idx_ext_persist_status，降低批写 ODKU 热点。
  # 对应 docs/superpowers/specs/2026-07-23-drop-idx-ext-persist-status-design.md
  # 与 docs/交行直充业务系统高可用方案设计.md「6.6 新增表」建议约束、详细设计「14.3」。
  - changeSet:
      id: 0016-d2-drop-recharge-order-ext-persist-status-index
      author: codex
      changes:
        - sql:
            sql: |
              ALTER TABLE recharge_order_ext
                DROP INDEX idx_ext_persist_status
      rollback:
        - sql:
            sql: |
              ALTER TABLE recharge_order_ext
                ADD INDEX idx_ext_persist_status (persist_status, updated_at)
  # 0017：恢复 recharge_dispatch_outbox.event_id 唯一键，确保 outbox 幂等与 event_id 直查语义成立。
  # 如果线上已经存在重复 event_id，这个变更会在 ADD UNIQUE KEY 阶段直接失败，避免把脏数据继续放行。
  - changeSet:
      id: 0017-d2-restore-recharge-dispatch-outbox-event-id-uk
      author: codex
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              SET @dispatch_event_id_unique_exists := (
                SELECT COUNT(*)
                FROM information_schema.statistics
                WHERE table_schema = DATABASE()
                  AND table_name = 'recharge_dispatch_outbox'
                  AND index_name = 'uk_dispatch_outbox_event_id'
                  AND non_unique = 0
              );
              SET @dispatch_restore_sql := IF(
                @dispatch_event_id_unique_exists = 0,
                'ALTER TABLE recharge_dispatch_outbox ADD UNIQUE KEY uk_dispatch_outbox_event_id (event_id)',
                'SELECT 1'
              );
              PREPARE stmt FROM @dispatch_restore_sql;
              EXECUTE stmt;
              DEALLOCATE PREPARE stmt;
      rollback:
        - sql:
            sql: |
              SELECT 1

  # V1.2首次实现的结构记录，商户级版本不再读写此表和订单绑定列；保留既有变更记录。
  - changeSet:
      id: 0018-v12-signing-credentials
      author: codex
      changes:
        - sql:
            sql: |
              CREATE TABLE recharge_v12_signing_key (
                key_id varchar(64) CHARACTER SET ascii COLLATE ascii_bin NOT NULL COMMENT '签名密钥标识',
                app_id varchar(128) COLLATE utf8mb4_bin NOT NULL COMMENT '商户应用ID',
                org_code varchar(64) COLLATE utf8mb4_bin NOT NULL COMMENT '商户编码',
                encrypted_sign_key varchar(256) CHARACTER SET ascii COLLATE ascii_bin NOT NULL COMMENT 'AES-256-GCM加密签名密钥',
                request_expires_at_ms bigint NOT NULL COMMENT '配对请求凭证到期毫秒时间戳',
                revoked_at datetime(3) NULL COMMENT '密钥撤销时间',
                created_at datetime(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3) COMMENT '密钥创建时间',
                PRIMARY KEY (key_id),
                KEY idx_v12_key_merchant (org_code, app_id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT='V1.2独立签名凭证';
              ALTER TABLE recharge_order_ext
                ADD COLUMN signing_key_id varchar(64) CHARACTER SET ascii COLLATE ascii_bin NOT NULL DEFAULT '' COMMENT '订单创建时绑定的签名密钥标识',
                ADD INDEX idx_order_signing_key (signing_key_id);
      # 已签发凭证和订单绑定不可在回滚时直接丢弃，回滚操作必须保留历史密钥及绑定。
      rollback:
        - sql:
            sql: SELECT 1

  # 商户级签名密钥：参见详细设计「V1.2 密钥存储实施约束」。开发/测试直接建表，不迁移旧数据。
  - changeSet:
      id: 0019-v12-merchant-signing-keys
      author: codex
      changes:
        - sql:
            sql: |
              CREATE TABLE recharge_v12_merchant_key (
                org_code varchar(64) COLLATE utf8mb4_bin NOT NULL COMMENT '商户编码',
                current_key_id varchar(64) CHARACTER SET ascii COLLATE ascii_bin NULL COMMENT '商户当前签名密钥标识',
                created_at datetime(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3) COMMENT '创建时间',
                PRIMARY KEY (org_code)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT='V1.2商户当前签名密钥指针';
              CREATE TABLE recharge_v12_merchant_signing_key (
                key_id varchar(64) CHARACTER SET ascii COLLATE ascii_bin NOT NULL COMMENT '签名密钥标识',
                org_code varchar(64) COLLATE utf8mb4_bin NOT NULL COMMENT '商户编码',
                encrypted_sign_key varchar(256) CHARACTER SET ascii COLLATE ascii_bin NOT NULL COMMENT 'AES-256-GCM加密签名密钥',
                key_status varchar(16) CHARACTER SET ascii COLLATE ascii_bin NOT NULL COMMENT '密钥状态：CURRENT当前、RETIRED历史、REVOKED撤销',
                created_at datetime(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3) COMMENT '密钥创建时间',
                retired_at datetime(3) NULL COMMENT '密钥退役时间',
                revoked_at datetime(3) NULL COMMENT '密钥撤销时间',
                PRIMARY KEY (key_id),
                KEY idx_v12_merchant_key_status (org_code, key_status)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT='V1.2商户签名密钥版本';
      # 当前/历史密钥用于正常回调重试；回滚应用不自动销毁密钥。
      rollback:
        - sql:
            sql: SELECT 1
